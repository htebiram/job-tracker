<section class="applications" aria-labelledby="applications-title">
  <app-page-header
    eyebrow="Pipeline"
    title="Applications"
    description="Track every opportunity and next step."
    headingId="applications-title"
  >
    <button pageHeaderActions class="primary" type="button" (click)="openCreate()">
      Add application
    </button>
  </app-page-header>

  <app-application-filters
    [statuses]="statuses"
    [search]="search()"
    [status]="status()"
    [sort]="sort()"
    (searchChange)="updateSearch($event)"
    (statusChange)="updateStatus($event)"
    (sortChange)="updateSort($event)"
  />

  <app-application-table
    [applications]="visible()"
    [total]="filtered().length"
    [page]="page()"
    [pageCount]="pageCount()"
    (selected)="selected.set($event)"
    (edited)="openEdit($event)"
    (deleted)="pendingDelete.set($event)"
    (pageChanged)="changePage($event)"
  />
</section>

@if (selected(); as application) {
  <app-application-details [application]="application" (closed)="selected.set(null)" />
}

@if (isFormOpen()) {
  <app-application-form-dialog
    [application]="editing()"
    (saved)="save($event)"
    (cancelled)="isFormOpen.set(false)"
  />
}

@if (pendingDelete(); as application) {
  <app-delete-application-dialog
    [application]="application"
    (confirmed)="confirmDelete()"
    (cancelled)="pendingDelete.set(null)"
  />
}
