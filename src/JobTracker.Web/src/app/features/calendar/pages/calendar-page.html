<section class="calendar-page" aria-labelledby="calendar-title">
  <app-page-header
    eyebrow="Schedule"
    title="Calendar"
    description="Interviews, deadlines, and follow-ups in one view."
    headingId="calendar-title"
  >
    <div pageHeaderActions class="views" aria-label="Calendar view">
      <button type="button" [class.active]="view() === 'Month'" (click)="view.set('Month')">
        Month
      </button>
      <button type="button" [class.active]="view() === 'Agenda'" (click)="view.set('Agenda')">
        Agenda
      </button>
    </div>
  </app-page-header>

  <div class="layout">
    <app-calendar-view
      [view]="view()"
      [monthLabel]="monthLabel()"
      [weekdays]="weekdays"
      [days]="days()"
      [selectedDate]="selectedDate()"
      [agenda]="agenda()"
      (monthChanged)="changeMonth($event)"
      (dateSelected)="selectedDate.set($event)"
    />
    <app-schedule-sidebar
      [selectedDate]="selectedDate()"
      [selectedEvents]="selectedEvents()"
      [interviews]="interviews()"
      [reminders]="reminders()"
    />
  </div>
</section>
