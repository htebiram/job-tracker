<section class="dashboard" aria-labelledby="dashboard-title">
  <app-page-header
    eyebrow="Overview"
    [title]="'Good morning, ' + dashboard().userName + '.'"
    description="Here is what is happening across your job search."
    headingId="dashboard-title"
  >
    <a
      pageHeaderActions
      class="primary-action"
      routerLink="/workspace/applications"
      [queryParams]="{ action: 'create' }"
    >
      Add application
    </a>
  </app-page-header>

  <app-summary-statistics [metrics]="dashboard().metrics" />

  <div class="grid">
    <app-status-chart [statuses]="dashboard().statuses" [total]="dashboard().metrics[0].value" />
    <app-upcoming-interviews [interviews]="dashboard().upcomingInterviews" />
    <app-recent-applications [applications]="dashboard().recentApplications" />
    <app-activity-feed [activities]="dashboard().recentActivity" />
  </div>
</section>
