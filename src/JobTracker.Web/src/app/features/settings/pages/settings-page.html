<section class="settings" aria-labelledby="settings-title">
  <app-page-header
    eyebrow="Preferences"
    title="Settings"
    description="Manage your workspace profile, calendar, and notification preferences."
    headingId="settings-title"
  />

  <form [formGroup]="form" (ngSubmit)="save()">
    <section class="panel" aria-labelledby="profile-title">
      <div class="section-heading">
        <div>
          <h2 id="profile-title">Profile</h2>
          <p>Information shown in your personal workspace.</p>
        </div>
        <span class="avatar" aria-hidden="true">JD</span>
      </div>
      <div class="field-grid">
        <label>
          Display name
          <input formControlName="displayName" />
          @if (form.controls.displayName.touched && form.controls.displayName.invalid) {
            <span class="error">Display name is required.</span>
          }
        </label>
        <label>
          Email address
          <input type="email" formControlName="email" />
          @if (form.controls.email.touched && form.controls.email.invalid) {
            <span class="error">Enter a valid email address.</span>
          }
        </label>
      </div>
    </section>

    <section class="panel" aria-labelledby="workspace-title">
      <h2 id="workspace-title">Workspace preferences</h2>
      <p>Choose how dates and schedules appear.</p>
      <label class="select-field">
        Start of week
        <select formControlName="weekStart">
          <option>Monday</option>
          <option>Sunday</option>
        </select>
      </label>
    </section>

    <section class="panel" aria-labelledby="notifications-title">
      <h2 id="notifications-title">Notifications</h2>
      <p>Control the reminders generated by your local workspace.</p>
      <label class="toggle">
        <span
          ><strong>Interview reminders</strong
          ><small>Remind me about upcoming interviews.</small></span
        >
        <input type="checkbox" formControlName="interviewReminders" />
      </label>
      <label class="toggle">
        <span
          ><strong>Task reminders</strong
          ><small>Highlight tasks as their due dates approach.</small></span
        >
        <input type="checkbox" formControlName="taskReminders" />
      </label>
      <label class="toggle">
        <span><strong>Weekly summary</strong><small>Prepare a weekly pipeline recap.</small></span>
        <input type="checkbox" formControlName="weeklySummary" />
      </label>
    </section>

    <div class="form-actions">
      @if (saved()) {
        <p role="status">Settings saved locally.</p>
      }
      <button class="primary" type="submit">Save changes</button>
    </div>
  </form>
</section>
