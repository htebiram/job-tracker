<section class="tasks" aria-labelledby="tasks-title">
  <app-page-header
    eyebrow="Focus list"
    title="Tasks"
    description="Keep follow-ups and deadlines moving."
    headingId="tasks-title"
  >
    <button pageHeaderActions class="primary" type="button" (click)="openCreate()">Add task</button>
  </app-page-header>

  <app-task-filters
    [priorities]="priorities"
    [categories]="categories"
    [priority]="priority()"
    [category]="category()"
    [view]="view()"
    [activeCount]="activeCount()"
    [completedCount]="completedCount()"
    (priorityChange)="priority.set($event)"
    (categoryChange)="category.set($event)"
    (viewChange)="view.set($event)"
  />

  <app-task-list
    [tasks]="visible()"
    (toggled)="toggle($event)"
    (edited)="openEdit($event)"
    (archived)="archive($event)"
  />
</section>

@if (isFormOpen()) {
  <app-task-form-dialog
    [task]="editing()"
    [priorities]="priorities"
    [categories]="categories"
    (saved)="save($event)"
    (cancelled)="isFormOpen.set(false)"
  />
}
