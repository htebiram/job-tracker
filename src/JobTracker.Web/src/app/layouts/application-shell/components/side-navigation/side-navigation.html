<aside class="side-navigation">
  <nav
    id="primary-navigation"
    aria-label="Primary navigation"
    [attr.aria-hidden]="!isOpen() ? null : false"
  >
    <p class="section-label">Menu</p>
    <ul>
      @for (item of primaryNavigation; track item.label) {
        <li>
          <a
            [routerLink]="item.route"
            routerLinkActive="is-active"
            [routerLinkActiveOptions]="{ exact: true }"
            (click)="navigationSelected.emit()"
          >
            <span class="item-mark" aria-hidden="true">{{ item.shortLabel }}</span>
            <span>{{ item.label }}</span>
          </a>
        </li>
      }
    </ul>
  </nav>

  <a class="public-link" routerLink="/">Return to public site</a>
</aside>
